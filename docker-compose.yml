services:
  taleweaver:
    build: .
    image: taleweaver:latest
    container_name: taleweaver
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed on purpose: this is the port the app listens on *inside* the
      # container. PORT in .env only chooses the port on the host, below —
      # it must not also reach the app itself, or the two disagree and the
      # healthcheck (which checks this fixed port) fails.
      - PORT=3000
    ports:
      # Only reachable from this machine by default: point your reverse proxy at it.
      # Set BIND_ADDRESS=0.0.0.0 in .env if the proxy runs on another machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - taleweaver-data:/app/data
      # Optional: your own ambience and sound-effect files (see public/audio/README.md).
      # - ./audio:/app/public/audio:ro
    extra_hosts:
      # Lets the container reach services on the host machine (e.g. a local Ollama
      # instance) via http://host.docker.internal:<port>. Docker Desktop provides
      # this automatically; on Linux it needs this explicit mapping (Docker Engine 20.10+).
      - "host.docker.internal:host-gateway"

volumes:
  taleweaver-data:
