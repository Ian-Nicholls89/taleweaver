services:
  taleweaver:
    build: .
    image: taleweaver:latest
    container_name: taleweaver
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed on purpose: this is the port the app listens on *inside* the
      # container. PORT in .env only chooses the port on the host, below —
      # it must not also reach the app itself, or the two disagree and the
      # healthcheck (which checks this fixed port) fails.
      - PORT=3000
    ports:
      # Only reachable from this machine by default: point your reverse proxy at it.
      # Set BIND_ADDRESS=0.0.0.0 in .env if the proxy runs on another machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - taleweaver-data:/app/data
      # Optional: your own ambience and sound-effect files (see public/audio/README.md).
      # - ./audio:/app/public/audio:ro
    extra_hosts:
      # Only needed if Ollama (or another AI backend) runs directly on this host
      # rather than as the "ollama" service below — lets the container reach it
      # via http://host.docker.internal:<port>. Docker Desktop provides this
      # automatically; on Linux it needs this explicit mapping (Engine 20.10+).
      - "host.docker.internal:host-gateway"

  # Optional: Ollama as its own container, so you don't need it installed on the
  # host at all. Off by default — start it with:
  #   docker compose --profile ollama up -d
  # Then in Admin → AI models, set the Ollama address to http://ollama:11434
  # (the two containers share a network and can reach each other by service name —
  # no host.docker.internal needed for this path). Pull a model into it with:
  #   docker compose exec ollama ollama pull llama3.1
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment if you have an NVIDIA GPU and the nvidia-container-toolkit installed
    # (without it — including Intel Arc/integrated graphics, e.g. Meteor Lake NUCs,
    # which this image doesn't accelerate — Ollama runs on CPU only: fine for models
    # up to ~8-14B, slow for larger ones):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  taleweaver-data:
  ollama-data:
